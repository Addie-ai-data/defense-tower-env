[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "support-triage-openenv"
version = "0.1.0"
description = "A real-world OpenEnv environment for customer support ticket triage."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Tanbo" }]
dependencies = [
    "openenv-core>=0.2.1",
    "openai>=1.40.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
]

[project.scripts]
server = "server.app:main"

[tool.setuptools]
py-modules = ["client", "models"]

[tool.setuptools.packages.find]
include = ["server"]
